server:
  port: 10010  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
tj:
  secret: 1oEYCJ7RWcj9ygfsVfw8L8MUj94aLtKZxqd3aB2x6Yg
spring:
  profiles:
    active: local
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: as
          uri: lb://auth-service
          predicates:
            - Path=/as/**
          filters:
            - PreserveHostHeader
        - id: us
          uri: lb://user-service
          predicates:
            - Path=/us/**
        - id: res
          uri: lb://resume-service
          predicates:
            - Path=/res/**
        - id: is
          uri: lb://interview-session-service
          predicates:
            - Path=/is/**
        - id: ae
          uri: lb://ai-evaluation-service
          predicates:
            - Path=/ae/**
        - id: fa
          uri: lb://feedback-analysis-service
          predicates:
            - Path=/fa/**
        - id: ug
          uri: lb://user-growth-service
          predicates:
            - Path=/ug/**

      default-filters:
        - StripPrefix=1
      globalcors: # 全局的跨域处理
        add-to-simple-url-handler-mapping: true # 解决options请求被拦截问题
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: # 允许哪些网站的跨域请求
              - "*"
            allowedMethods: # 允许的跨域ajax的请求方式
              - "GET"
              - "POST"
              - "DELETE"
              - "PUT"
              - "OPTIONS"
            allowedHeaders: "*" # 允许在请求中携带的头信息
            allowCredentials: true # 是否允许携带cookie
            maxAge: 360000 # 这次跨域检测的有效期
